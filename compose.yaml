name: max-capital-challenge

x-kafka-image: &kafka-image apache/kafka:4.2.1@sha256:9916d60eca5d599550e2c320230808fda342124ba550bb4ac4ea8591803262a0

x-application: &application
  build: .
  image: max-capital-challenge:0.1.0-SNAPSHOT
  init: true
  depends_on:
    postgres:
      condition: service_healthy
    kafka-init:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD", "curl", "--fail", "--silent", "--max-time", "10", "http://localhost:8080/actuator/health/readiness"]
    interval: 10s
    timeout: 12s
    start_period: 45s
    retries: 6

x-application-environment: &application-environment
  DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-orders}?connectTimeout=3&socketTimeout=3&tcpKeepAlive=true
  DB_USER: ${POSTGRES_USER:-orders}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-orders}
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092

services:
  postgres:
    image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orders}
      POSTGRES_USER: ${POSTGRES_USER:-orders}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orders}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: *kafka-image
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 12

  kafka-init:
    image: *kafka-image
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/init-topics.sh"]
    volumes:
      - ./docker/init-topics.sh:/scripts/init-topics.sh:ro

  app-1:
    <<: *application
    environment:
      <<: *application-environment
      INSTANCE_ID: app-1
    ports:
      - "127.0.0.1:8081:8080"

  app-2:
    <<: *application
    environment:
      <<: *application-environment
      INSTANCE_ID: app-2
    ports:
      - "127.0.0.1:8082:8080"

  verify-f02:
    profiles: ["tools"]
    image: max-capital-challenge-smoke:0.1.0-SNAPSHOT
    build:
      context: ./scripts
      dockerfile: Dockerfile.smoke
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
      DOCKER_HOST: unix:///var/run/docker.sock
    depends_on:
      app-1:
        condition: service_healthy
      app-2:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${SMOKE_DOCKER_SOCKET:-/var/run/docker.sock}
        target: /var/run/docker.sock
        bind:
          create_host_path: false

volumes:
  postgres-data:
  kafka-data:
