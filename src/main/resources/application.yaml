spring:
  application:
    name: max-capital-challenge
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/orders?connectTimeout=3&socketTimeout=3&tcpKeepAlive=true}
    username: ${DB_USER:orders}
    password: ${DB_PASSWORD:orders}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      connection-timeout: 2500
      validation-timeout: 1000
  flyway:
    schemas: app
    default-schema: app
    create-schemas: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: max-capital-orders-v1
      enable-auto-commit: false
      auto-offset-reset: earliest
      max-poll-records: 1
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      properties:
        isolation.level: read_committed
    producer:
      transaction-id-prefix: ${app.instance-id}-tx-
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer

app:
  instance-id: ${INSTANCE_ID:local}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,kafka
  info:
    env:
      enabled: true

info:
  app:
    name: '@project.artifactId@'
    version: '@project.version@'
    instance-id: ${app.instance-id}
